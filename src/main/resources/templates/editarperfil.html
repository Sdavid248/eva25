<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    
    <!-- ✅ SOLUCIÓN VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Editar Perfil</h2>

    <form th:action="@{/perfil/editar}" th:object="${usuario}" method="post">

        <label for="nombre">Nombre:</label>
        <input id="nombre" type="text" th:field="*{nombre}" class="form-control"/>

        <label for="direccion">Dirección:</label>
        <input id="direccion" type="text" th:field="*{direccion}" class="form-control"/>

        <label for="telefono">Teléfono:</label>
        <input id="telefono" type="text" th:field="*{telefono}" class="form-control"/>

        <label for="edad">Edad:</label>
        <input id="edad" type="number" th:field="*{edad}" class="form-control"/>

        <label for="ocupacion">Ocupación:</label>
        <input id="ocupacion" type="text" th:field="*{ocupacion}" class="form-control"/>

        <label for="intereses">Intereses:</label>
        <textarea id="intereses" th:field="*{intereses}" class="form-control"></textarea>

        <label for="foto">URL Foto:</label>
        <input id="foto" type="text" th:field="*{foto}" class="form-control"/>

        <br>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/perfil" class="btn btn-secondary">Cancelar</a>

    </form>
</div>

</body>
</html>
