<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Detalle Usuario</h2>
            </div>
            <div class="card-body">
                <p><strong>ID:</strong> <span th:text="${usuario.idUser}"></span></p>
                <p><strong>Documento:</strong> <span th:text="${usuario.documento}"></span></p>
                <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
                <p><strong>Correo:</strong> <span th:text="${usuario.correo}"></span></p>
                <p><strong>Estado:</strong> <span th:text="${usuario.estado}"></span></p>
            </div>
            <div class="card-footer text-end">
                <a th:href="@{/usuarios/list}" class="btn btn-secondary">Volver</a>
            </div>
        </div>
    </div>

</body>
</html>
