<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/view.css}" />
</head>
<body class="page">

    <div class="container">
        <h1 class="title">Gestión de Usuarios</h1>

        <!-- 🔍 Formulario de Filtros -->
        <form th:action="@{/usuarios}" method="get" class="filter-form">
            <input type="text" name="nombre" th:value="${nombre}" placeholder="Filtrar por nombre" class="input"/>

            <!-- SOLO ADMIN puede filtrar por correo -->
            <input type="text" name="correo" th:value="${correo}"
                   placeholder="Filtrar por correo" class="input"
                   th:if="${esAdmin}" />

            <input type="text" name="estado" th:value="${estado}" placeholder="Filtrar por estado" class="input"/>

            <!-- SOLO ADMIN puede filtrar por documento -->
            <input type="text" name="documento" th:value="${documento}"
                   placeholder="Filtrar por documento" class="input"
                   th:if="${esAdmin}" />

            <!-- SOLO ADMIN puede filtrar por teléfono -->
            <input type="text" name="telefono" th:value="${telefono}"
                   placeholder="Filtrar por teléfono" class="input"
                   th:if="${esAdmin}" />

            <!-- SOLO ADMIN puede filtrar por dirección -->
            <input type="text" name="direccion" th:value="${direccion}"
                   placeholder="Filtrar por dirección" class="input"
                   th:if="${esAdmin}" />

            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Limpiar</a>
        </form>

        <!-- ➕ Botón nuevo usuario SOLO ADMIN -->
        <p class="new-user" th:if="${esAdmin}">
            <a th:href="@{/usuarios/nuevo}" class="btn btn-success">➕ Nuevo Usuario</a>
        </p>

        <!-- 📋 Tabla de usuarios -->
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>

                <!-- COLUMNA CORREO solo ADMIN -->
                <th th:if="${esAdmin}">Correo</th>

                <th>Estado</th>

                <!-- COLUMNA DOCUMENTO solo ADMIN -->
                <th th:if="${esAdmin}">Documento</th>

                <!-- COLUMNA TELÉFONO solo ADMIN -->
                <th th:if="${esAdmin}">Teléfono</th>

                <!-- COLUMNA DIRECCIÓN solo ADMIN -->
                <th th:if="${esAdmin}">Dirección</th>

                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>

<!-- CORREGIDO: usuarios es Page → se itera directamente -->
<tr th:each="usuario : ${usuarios}">

<td th:text="${usuario.idUser}"></td>

                <td th:text="${usuario.nombre}"></td>

                <!-- CORREO solo admin -->
                <td th:if="${esAdmin}" th:text="${usuario.correo}"></td>

                <td th:text="${usuario.estado}"></td>

                <!-- DOCUMENTO solo admin -->
                <td th:if="${esAdmin}" th:text="${usuario.documento}"></td>

                <!-- TELÉFONO solo admin -->
                <td th:if="${esAdmin}" th:text="${usuario.telefono}"></td>

                <!-- DIRECCIÓN solo admin -->
                <td th:if="${esAdmin}" th:text="${usuario.direccion}"></td>

                <td>
                    <!-- SOLO ADMIN puede editar/eliminar -->
                    <span th:if="${esAdmin}">
                        <!-- CORREGIDO id → idUser -->
                        <a th:href="@{'/usuarios/editar/' + ${usuario.idUser}}" class="btn-link edit">✏️ Editar</a> |
                        <a th:href="@{'/usuarios/eliminar/' + ${usuario.idUser}}"
                           onclick="return confirm('¿Seguro que deseas eliminar este usuario?')"
                           class="btn-link delete">🗑️ Eliminar</a>
                    </span>

                    <!-- Usuario normal → NO botones -->
                    <span th:if="${!esAdmin}">
                        <span class="no-access">Sin permisos</span>
                    </span>
                </td>
            </tr>

            <tr th:if="${usuarios.totalElements == 0}">
                <td colspan="8" class="no-results">No se encontraron usuarios</td>
            </tr>
            </tbody>
        </table>

        <!-- 📑 Paginación -->
        <div class="pagination">
            <span th:text="'Página ' + ${usuarios.number + 1} + ' de ' + ${usuarios.totalPages}"></span>

            <div class="pagination-links">
                <a th:if="${usuarios.hasPrevious()}"
                    th:href="@{/usuarios(
                        page=${usuarios.number - 1},
                        size=${usuarios.size},
                        nombre=${nombre},
                        correo=${esAdmin ? correo : null},
                        estado=${estado},
                        documento=${esAdmin ? documento : null},
                        telefono=${esAdmin ? telefono : null},
                        direccion=${esAdmin ? direccion : null}
                    )}"
                    class="page-link">⬅️ Anterior</a>

                <span th:each="i : ${#numbers.sequence(0, usuarios.totalPages - 1)}">
                    <a th:href="@{/usuarios(
                            page=${i},
                            size=${usuarios.size},
                            nombre=${nombre},
                            correo=${esAdmin ? correo : null},
                            estado=${estado},
                            documento=${esAdmin ? documento : null},
                            telefono=${esAdmin ? telefono : null},
                            direccion=${esAdmin ? direccion : null}
                        )}"
                       th:text="${i + 1}"
                       th:classappend="${i == usuarios.number} ? 'active page-link' : 'page-link'"></a>
                </span>

                <a th:if="${usuarios.hasNext()}"
                    th:href="@{/usuarios(
                        page=${usuarios.number + 1},
                        size=${usuarios.size},
                        nombre=${nombre},
                        correo=${esAdmin ? correo : null},
                        estado=${estado},
                        documento=${esAdmin ? documento : null},
                        telefono=${esAdmin ? telefono : null},
                        direccion=${esAdmin ? direccion : null}
                    )}"
                    class="page-link">Siguiente ➡️</a>
            </div>
        </div>
    </div>

</body>
</html>
