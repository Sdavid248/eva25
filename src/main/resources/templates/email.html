<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EVA - Notificación</title>

    <!-- MODO OSCURO AUTOMÁTICO PARA CLIENTES QUE LO SOPORTEN -->
    <style>
        @media (prefers-color-scheme: dark) {
            body {
                background: #1c1f26 !important;
            }
            .card {
                background: #2a2e37 !important;
                color: #f3f4f6 !important;
            }
            .footer {
                color: #ccc !important;
            }
        }

        /* ANIMACIÓN CABECERA */
        .header-anim {
            background: linear-gradient(90deg, #0d6efd, #6610f2);
            animation: move 6s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif; background:#f5f7fb; padding:20px; margin:0;">

<!-- TARJETA PRINCIPAL -->
<div class="card" style="
    max-width:600px;
    margin:20px auto;
    background:#ffffff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 5px rgba(0,0,0,0.08);
">

    <!-- CABECERA ANIMADA -->
    <div class="header-anim" style="
        padding:25px;
        border-radius:10px;
        text-align:center;
        color:white;
        font-size:22px;
        font-weight:bold;
        letter-spacing:1px;
        margin-bottom:20px;
    ">
        ✉ Nueva Notificación del Sistema E.V.A.
    </div>

    <!-- SALUDO -->
    <h2 style="color:#222; font-size:20px; margin:0 0 10px 0;">
        Hola <span th:text="${nombre}">Usuario</span> 👋
    </h2>

    <!-- CONTENIDO HTML DEL MENSAJE -->
    <div style="font-size:15px; color:#333; line-height:1.6;" th:utext="${mensaje}">
        Contenido del mensaje enviado por el administrador.
    </div>

    <!-- BOTÓN CTA -->
    <div style="margin-top:25px; text-align:center;">
        <a href="http://localhost:8081/"
           style="
               display:inline-block;
               padding:12px 20px;
               background:#0d6efd;
               color:white;
               text-decoration:none;
               border-radius:8px;
               font-size:16px;
               font-weight:bold;
               box-shadow:0 3px 6px rgba(13,110,253,0.3);
               transition:0.3s;
           ">
            Ver Notificación
        </a>
    </div>

    <!-- SEPARADOR -->
    <hr style="margin:25px 0; border:none; border-top:1px solid #eee;">

    <!-- PIE DE PÁGINA -->
    <p class="footer" style="font-size:13px; color:#888; margin:0;">
        Este correo fue enviado automáticamente por el sistema <strong>E.V.A</strong>.
        Si no lo solicitaste, contacta al administrador.
    </p>
</div>

</body>
</html>
