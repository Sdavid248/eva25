<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Notificación EVA</title>
    <style>
        @media (prefers-color-scheme: dark) {
            body { background:#1e1e1e !important; }
            .card { background:#2a2a2a !important; color:#eee !important; }
            .footer { color:#aaa !important; }
        }
        .header-anim { animation: fadeInDown 0.8s ease-out; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body style="margin:0; padding:20px; background:#f5f7fb; font-family: Arial, sans-serif;">
<div class="card" style="max-width:600px; margin:20px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.08);">
    <div class="header-anim" style="text-align:center; margin-bottom:20px;">
        <img src="https://via.placeholder.com/150x50?text=EVA" alt="EVA" style="max-width:150px; margin-bottom:10px;">
        <h2 style="margin:0; font-size:22px; color:#0d6efd;" th:text="${titulo}">Título de la Notificación</h2>
    </div>

    <p style="font-size:16px; color:#333; margin-top:0;">
        Hola <strong th:text="${nombre}">Usuario</strong> 👋
    </p>

    <div style="font-size:15px; color:#444; line-height:1.6;" th:utext="${mensaje}">
        Mensaje HTML enviado por el administrador.
    </div>

    <div style="text-align:center; margin-top:25px;">
        <!-- Usa ctaUrl pasado desde el contexto (por ejemplo: http://localhost:8081/login) -->
        <a th:href="${ctaUrl}" 
           style="background:#0d6efd; padding:12px 22px; color:white; text-decoration:none; border-radius:6px; font-size:15px; font-weight:bold; display:inline-block;">
            Ver Notificación
        </a>
    </div>

    <hr style="margin:25px 0; border:none; border-top:1px solid #eee;">

    <p class="footer" style="font-size:12px; color:#888; margin:0; text-align:center;">
        Este correo fue enviado por el sistema <strong>E.V.A</strong>.  
        Si no solicitaste esta notificación, ignora este mensaje.
    </p>
</div>
</body>
</html>
