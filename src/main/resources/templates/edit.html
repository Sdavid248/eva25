<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
</head>
<body>
    <h2>Editar Usuario</h2>
    <form th:action="@{/usuarios/save}" th:object="${usuario}" method="post">
        
        <input type="hidden" th:field="*{idUser}">

        <label for="documento">Documento:</label>
        <input type="text" id="documento" th:field="*{documento}" placeholder="Ingrese el documento"><br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre"><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ingrese la dirección"><br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ingrese el teléfono"><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="Ingrese el correo"><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" th:field="*{estado}" placeholder="Ingrese el estado"><br>

        <button type="submit">Actualizar</button>
    </form>

    <a th:href="@{/usuarios/list}">Volver</a>
</body>
</html>
