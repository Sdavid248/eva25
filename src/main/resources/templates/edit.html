<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h2 class="mb-0">Editar Usuario</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/usuarios/save}" th:object="${usuario}" method="post">
                    
                    <!-- Campo oculto para el ID -->
                    <input type="hidden" th:field="*{idUser}">

                    <div class="mb-3">
                        <label for="documento" class="form-label">Documento:</label>
                        <input type="text" class="form-control" id="documento" th:field="*{documento}" placeholder="Ingrese el documento">
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre">
                    </div>

                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección:</label>
                        <input type="text" class="form-control" id="direccion" th:field="*{direccion}" placeholder="Ingrese la dirección">
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono:</label>
                        <input type="text" class="form-control" id="telefono" th:field="*{telefono}" placeholder="Ingrese el teléfono">
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo:</label>
                        <input type="email" class="form-control" id="correo" th:field="*{correo}" placeholder="Ingrese el correo">
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado:</label>
                        <input type="text" class="form-control" id="estado" th:field="*{estado}" placeholder="Ingrese el estado">
                    </div>

                    <button type="submit" class="btn btn-warning text-dark">Actualizar</button>
                    <a th:href="@{/usuarios/list}" class="btn btn-secondary ms-2">Volver</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
