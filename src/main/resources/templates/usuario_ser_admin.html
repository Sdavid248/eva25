<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Centro Deportivo</title>

    <link rel="stylesheet" th:href="@{/css/crear_centro.css}">

    <!-- 🔥 LEAFLET -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<div class="container">

    <h2>Crear Centro Deportivo</h2>

    <form action="/usuario/crear-centro" method="post">

        <input type="text" name="nombre" placeholder="Nombre" required>

        <!-- 🔥 DIRECCION -->
        <input type="text" id="direccion" name="direccion" placeholder="Dirección" required>
        <button type="button" onclick="buscarDireccion()">Buscar dirección</button>

        <!-- 🔥 MAPA -->
        <div id="map"></div>

        <!-- 🔥 OCULTOS -->
        <input type="hidden" id="lat" name="lat">
        <input type="hidden" id="lng" name="lng">

        <input type="text" name="telefono" placeholder="Teléfono" required>
        <input type="email" name="correo" placeholder="Correo" required>
        <input type="text" name="apertura" placeholder="Hora apertura" required>
        <input type="text" name="cierre" placeholder="Hora cierre" required>
        <input type="number" name="capacidad" placeholder="Capacidad" required>
        <input type="text" name="estado" placeholder="Estado" required>
        <input type="text" name="tipo" placeholder="Tipo">

        <button type="submit">Crear y ser administrador</button>

    </form>

</div>

<script>
    var map = L.map('map').setView([4.60971, -74.08175], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker;

    map.on('click', function(e) {
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;

        document.getElementById("lat").value = lat;
        document.getElementById("lng").value = lng;

        if (marker) map.removeLayer(marker);

        marker = L.marker([lat, lng]).addTo(map);
    });

    function buscarDireccion() {
        var direccion = document.getElementById("direccion").value;

        fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + direccion)
            .then(response => response.json())
            .then(data => {

                if (data.length > 0) {
                    var lat = data[0].lat;
                    var lon = data[0].lon;

                    map.setView([lat, lon], 15);

                    document.getElementById("lat").value = lat;
                    document.getElementById("lng").value = lon;

                    if (marker) map.removeLayer(marker);

                    marker = L.marker([lat, lon]).addTo(map);
                } else {
                    alert("Dirección no encontrada");
                }
            });
    }
</script>

</body>
</html>
