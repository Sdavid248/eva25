<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Resultado Carga Masiva</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card-result {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 2.5rem;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <!-- TÍTULO -->
    <div class="text-center mb-4">
        <h2 class="fw-bold">📊 Resultado de la Carga Masiva</h2>
        <p class="text-muted">Resumen del procesamiento del archivo CSV</p>
    </div>

    <!-- TARJETAS DE RESULTADO -->
    <div class="row justify-content-center">

        <!-- CREADOS -->
        <div class="col-md-3 mb-3">
            <div class="card card-result text-center border-success">
                <div class="card-body">
                    <div class="icon text-success">👤</div>
                    <h5 class="card-title mt-2">Usuarios creados</h5>
                    <h3 class="fw-bold"
                        th:text="${creados}">0</h3>
                </div>
            </div>
        </div>

        <!-- INSCRITOS -->
        <div class="col-md-3 mb-3">
            <div class="card card-result text-center border-primary">
                <div class="card-body">
                    <div class="icon text-primary">✅</div>
                    <h5 class="card-title mt-2">Usuarios inscritos</h5>
                    <h3 class="fw-bold"
                        th:text="${inscritos}">0</h3>
                </div>
            </div>
        </div>

        <!-- REPETIDOS -->
        <div class="col-md-3 mb-3">
            <div class="card card-result text-center border-warning">
                <div class="card-body">
                    <div class="icon text-warning">⚠️</div>
                    <h5 class="card-title mt-2">Usuarios repetidos</h5>
                    <h3 class="fw-bold"
                        th:text="${repetidos}">0</h3>
                </div>
            </div>
        </div>

    </div>

    <!-- MENSAJE FINAL -->
    <div class="alert alert-info mt-4 text-center">
        <strong>Proceso finalizado.</strong>
        Revisa los valores anteriores para validar la carga masiva.
    </div>

    <!-- BOTONES -->
    <div class="text-center mt-4">
        <a href="/centrosdeportivos" class="btn btn-secondary me-2"></a>
            ⬅ Volver a Centros
        </a>

        <a href="/inscripcion_masiva" class="btn btn-primary"></a>
            🔁 Nueva carga masiva
        </a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
