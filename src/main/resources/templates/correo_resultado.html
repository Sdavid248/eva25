<!DOCTYPE html>
<html lang="es">
<head>

    <title>Resultado del envío</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f4f7f9, #e6edf3);

        .card {

        }
        .icon-check {
            font-size: 5rem;
            color: #28a745;
        }

</head>

        <div class="col-md-7 col-lg-5">

                <div class="icon-check mb-3">✔</div>

                <h2 class="text-success fw-bold">Correo enviado</h2>

                <p class="fs-5 mt-3">

                <a href="/correo/masivo" class="btn btn-primary btn-lg mt-4">

            </div>

</html>
