<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
</head>
<body>
    <h2>Lista de Usuarios</h2>

    <!-- Formulario de búsqueda -->
    <form th:action="@{/usuarios/list}" method="get">
        <label for="keyword">Buscar usuario:</label>
        <input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="Escriba un nombre o correo...">
        <button type="submit">Buscar</button>
    </form>

    <!-- Acciones -->
    <p>
        <a th:href="@{/usuarios/form}">➕ Nuevo Usuario</a> | 
        <a th:href="@{/pdf(keyword=${keyword})}">📄 Exportar PDF</a>
    </p>

    <!-- Tabla de usuarios -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.idUser}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.estado}"></td>
                <td>
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.idUser})}">✏️ Editar</a> |
                    <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.idUser})}" 
                       onclick="return confirm('¿Seguro que quieres eliminar este usuario?')">🗑️ Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
