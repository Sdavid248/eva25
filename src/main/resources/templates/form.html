<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="card-title mb-4"
                th:text="${usuario.idUser} != null ? 'Editar Usuario' : 'Nuevo Usuario'">
            </h2>

            <form th:action="@{/usuario/save}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{idUser}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                           placeholder="Ingrese el nombre" required>
                </div>

                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección:</label>
                    <input type="text" id="direccion" th:field="*{direccion}" class="form-control"
                           placeholder="Ingrese la dirección" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono:</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-control"
                           placeholder="Ingrese el teléfono">
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo:</label>
                    <input type="email" id="correo" th:field="*{correo}" class="form-control"
                           placeholder="Ingrese el correo" required>
                </div>

                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña:</label>
                    <input type="password" id="contrasena" th:field="*{contrasena}" class="form-control"
                           placeholder="Ingrese la contraseña" required>
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado:</label>
                    <input type="text" id="estado" th:field="*{estado}" class="form-control"
                           placeholder="Ingrese el estado">
                </div>

                <div class="mb-3">
                    <label for="documento" class="form-label">Documento:</label>
                    <input type="text" id="documento" th:field="*{documento}" class="form-control"
                           placeholder="Ingrese el documento" required>
                </div>

                <!-- 🔹 Nuevo campo Rol -->
                <div class="mb-3">
                    <label for="rol" class="form-label">Rol:</label>
                    <select id="rol" th:field="*{rol}" name="rolId" class="form-select" required>
                        <option value="" disabled th:selected="${usuario.rol == null}">Seleccione un rol</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"
                                th:selected="${usuario.rol != null and usuario.rol.id == r.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/usuario}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
