<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario</title>
</head>
<body>
    <h2 th:text="${usuario.idUser} != null ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>

    <form th:action="@{/usuario/save}" th:object="${usuario}" method="post">
        <input type="hidden" th:field="*{idUser}">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre" required><br><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ingrese la dirección" required><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ingrese el teléfono"><br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="Ingrese el correo" required><br><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" th:field="*{contrasena}" placeholder="Ingrese la contraseña" required><br><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" th:field="*{estado}" placeholder="Ingrese el estado"><br><br>

        <label for="documento">Documento:</label>
        <input type="text" id="documento" th:field="*{documento}" placeholder="Ingrese el documento" required><br><br>

        <button type="submit">Guardar</button>
        <a th:href="@{/usuario}">Cancelar</a>
    </form>
</body>
</html>
