<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
</head>
<body>
    <h2>Registrar Usuario</h2>
    <form th:action="@{/usuarios/save}" th:object="${usuario}" method="post">

        <label for="documento">Documento:</label>
        <input type="text" id="documento" th:field="*{documento}" placeholder="Ingrese su documento"><br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese su nombre"><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ingrese su dirección"><br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ingrese su teléfono"><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" th:field="*{correo}" placeholder="Ingrese su correo"><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" th:field="*{estado}" placeholder="Ingrese el estado"><br>

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" th:field="*{contrasena}" placeholder="Ingrese su contraseña"><br>

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/usuarios/list}">Volver</a>
</body>
</html>
