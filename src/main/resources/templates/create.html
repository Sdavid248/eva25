<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/create.css}" />
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card custom-card shadow-lg">
            <div class="card-header text-white text-center">
                <h2 class="mb-0">Registrar Usuario</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/usuarios/save}" th:object="${usuario}" method="post">

                    <div class="mb-3">
                        <label for="documento" class="form-label">Documento:</label>
                        <input type="text" class="form-control" id="documento" th:field="*{documento}" placeholder="Ingrese su documento">
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ingrese su nombre">
                    </div>

                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección:</label>
                        <input type="text" class="form-control" id="direccion" th:field="*{direccion}" placeholder="Ingrese su dirección">
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono:</label>
                        <input type="text" class="form-control" id="telefono" th:field="*{telefono}" placeholder="Ingrese su teléfono">
                    </div>

                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo:</label>
                        <input type="email" class="form-control" id="correo" th:field="*{correo}" placeholder="Ingrese su correo">
                    </div>

                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado:</label>
                        <input type="text" class="form-control" id="estado" th:field="*{estado}" placeholder="Ingrese el estado">
                    </div>

                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control" id="contrasena" th:field="*{contrasena}" placeholder="Ingrese su contraseña">
                    </div>

                    <button type="submit" class="btn btn-custom w-100">Guardar</button>
                </form>
            </div>
            <div class="card-footer text-end">
                <a th:href="@{/usuarios/list}" class="btn btn-outline-secondary">Volver</a>
            </div>
        </div>
    </div>

</body>
</html>
