<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<style>
#mi_mapa { width:100%; height:800px; }

#formCentro {
display:none;
position:fixed;
top:20%;
left:50%;
transform:translateX(-50%);
width:350px;
background:white;
padding:20px;
}
</style>
</head>

<body>

<div id="mi_mapa"></div>

<div id="formCentro">
<h3>Agregar Centro Deportivo</h3>
<input id="nombre" type="text" placeholder="Nombre del centro">
<input id="direccion" type="text" placeholder="Dirección real">
<input id="telefono" type="text" placeholder="Teléfono">
<input id="apertura" type="text" placeholder="Hora apertura">
<input id="cierre" type="text" placeholder="Hora cierre">
<button onclick="guardarCentro()">Guardar</button>
<button onclick="cerrarFormulario()">Cancelar</button>
</div>

<script th:inline="javascript">

const centros = /*[[${centros}]]*/ [];

let map = L.map('mi_mapa').setView([4.7110, -74.0721], 13);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// 🔥 POPUP CON INFO + INSCRIPCIÓN
const popup = `
    <b>${c.nombre}</b><br>
    ${c.direccion}<br>
    📞 ${c.telefono ?? 'No disponible'}<br><br>

    <form method="POST" action="/centrosdeportivos/inscribirme/${c.rut}">
        <button type="submit">Inscribirme</button>
    </form>
`;

const esAdmin = /*[[${esAdmin}]]*/ false;

if (esAdmin) {
    map.on('click', () => {
        document.getElementById("formCentro").style.display = "block";
    });
}

function cerrarFormulario() {
    document.getElementById("formCentro").style.display = "none";
}

async function guardarCentro() {

    const data = {
        nombre: document.getElementById("nombre").value,
        direccion: document.getElementById("direccion").value,
        telefono: document.getElementById("telefono").value,
        apertura: document.getElementById("apertura").value,
        cierre: document.getElementById("cierre").value
    };

    const token = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;

    const resp = await fetch("/centrosdeportivos/nuevo", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            [header]: token
        },
        body: JSON.stringify(data)
    });

    if (resp.ok) {
        alert("Centro guardado correctamente");
        location.reload();
    } else {
        const error = await resp.text();
        alert("Error: " + error);
    }
}

</script>

</body>
</html>
