<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa</title>
    <link rel="stylesheet" href="/css/estilos.css"> <!-- ajusta según tu carpeta -->
</head>
<body>

    <!-- 🔹 Menú de navegación unificado -->
    <nav class="nav_menu">
        <ul class="nav_links">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/acercade}">Acerca de</a></li>
            <li><a th:href="@{/centrosdeportivos}">Centros deportivos</a></li>
            <li><a th:href="@{/info}">Info</a></li>
            <li><a th:href="@{/mapa}">Mapa</a></li>
            <li><a th:href="@{/login}">Login</a></li>
            <li><a th:href="@{/registro}">Registro</a></li>
        </ul>
    </nav>

    <h2>Mapa de Centros Deportivos</h2>

    <!-- Contenedor del mapa -->
    <div id="mapa" style="width:100%; height:400px;"></div>

    <!-- Carga de Google Maps -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY_REAL&callback=initMap">
    </script>

    <script>
        function initMap() {
            var ubicacion = { lat: 4.60971, lng: -74.08175 }; // Bogotá, ejemplo
            var map = new google.maps.Map(document.getElementById("mapa"), {
                zoom: 12,
                center: ubicacion
            });
            new google.maps.Marker({
                position: ubicacion,
                map: map,
                title: "Centro Deportivo"
            });
        }
    </script>

</body>
</html>
