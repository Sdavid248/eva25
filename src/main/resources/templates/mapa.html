<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Street Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
        integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
        integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
    <link rel="stylesheet" href="/css/mapa.css">
</head>

<body>
    
    <!-- 🔹 Menú de navegación unificado -->
    <nav class="nav_menu">
        <ul class="nav_links">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/acercade}">Acerca de</a></li>
            <li><a th:href="@{/centrosdeportivos}">Centros deportivos</a></li>
            <li><a th:href="@{/info}">Info</a></li>
            <li><a th:href="@{/mapa}">Mapa</a></li>
            <li><a th:href="@{/login}">Login</a></li>
            <li><a th:href="@{/registro}">Registro</a></li>
        </ul>
    </nav>
    <br>
    <br>
    <br>

    <div id="mi_mapa" style="width: 100%; height: 500px;"></div>

<script>

    let map = L.map('mi_mapa').setView([4.7110, -74.0721], 13)

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);


    L.marker([4.650893, -74.063044]).addTo(map).bindPopup("SENA - Centro de Servicios Financieros")
    L.marker([4.665629, -74.083837]).addTo(map).bindPopup("SENA - Sede Salitre")

    map.on('click', onMapClick)

    function onMapClick(e) {
        alert("Posición: " + e.latlng)
    }
</script>
</body>

</html>
