<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" th:href="@{/css/mapa.css}" />

    <!-- 🔥 CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

    <!-- Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    

    <style>
        body {
            margin: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }

        #mi_mapa {
            height: 600px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<!-- 🔝 NAV -->
<nav class="nav_menu">
    <ul class="nav_links">
        <li><a th:href="@{/}">Inicio</a></li>
        <li><a th:href="@{/acercade}">Acerca de</a></li>
        <li><a th:href="@{/centrosdeportivos}">Centros deportivos</a></li>
        <li><a th:href="@{/info}">Info</a></li>
        <li><a th:href="@{/login}">Login</a></li>
        <li><a th:href="@{/registro}">Registro</a></li>
    </ul>
</nav>

<h2 style="text-align:center; color:white; margin-top:100px;">
    Mapa de Centros Deportivos
</h2>

<!-- 🔥 PANEL -->
<div class="panel">

    <div id="topPanel">
        <h4>🔥 Top Centros</h4>
        <div id="topLista"></div>
    </div>

    <input type="text" id="busqueda" placeholder="Buscar centro" />
    <button onclick="buscarCentro()">Buscar</button>
    <button onclick="verTop()">🔥 Top centros</button>

    
    <select id="filtroTipo" onchange="filtrarTipo()">
        <option value="">Todos</option>
        <option value="gym">Gym</option>
        <option value="piscina">Piscina</option>
        <option value="cancha">Cancha</option>
    </select>

    <button onclick="buscarCercanos()">Cercanos</button>

</div>

<!-- 🔥 MAPA -->
<div id="mi_mapa"></div>

<script>
let map = L.map("mi_mapa").setView([4.711, -74.0721], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let marcadores = [];
let rutaControl = null;
let usuarioLatLng = null;
let centrosGlobal = [];
let marcadoresTop = [];

const iconoTop = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png",
    iconSize: [35, 35],
});

function limpiarMapa() {
    marcadores.forEach(m => map.removeLayer(m));
    marcadores = [];

    if (rutaControl) {
        map.removeControl(rutaControl);
        rutaControl = null;
    }
}

function limpiarTop() {
    marcadoresTop.forEach(m => map.removeLayer(m));
    marcadoresTop = [];
}

function mostrarCentros(data) {
    limpiarMapa();

    data.sort((a, b) => (a.distancia || 0) - (b.distancia || 0));

    data.forEach(c => {
        const marker = L.marker([c.lat, c.lng]).addTo(map);

        marker.bindPopup(`
            <b>${c.nombre}</b><br>
            ${c.direccion}<br>
            🏷️ ${c.tipo || "N/A"}<br>
            📏 ${c.distancia ?? "N/A"} km<br>
            ⭐ ${estrellasHTML(Math.round(c.promedio || 0))} (${c.promedio || 0})<br><br>

            <button onclick="crearRuta(${c.lat}, ${c.lng})">Ir</button>
            <button onclick="verValoraciones(${c.rut})">Ver valoraciones</button>

            <hr>

            <form onsubmit="guardarValoracion(event, ${c.rut})">
                ⭐ 
                <select id="estrellas-${c.rut}">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select><br>

                <input type="text" id="comentario-${c.rut}" placeholder="Comentario"><br>
                <button type="submit">Enviar</button>
            </form>

            <div id="valoraciones-${c.rut}"></div>
        `);

        marcadores.push(marker);
    });

    centrosGlobal = data;
}
// 🔥 CARGA AUTOMÁTICA DE CENTROS (FIX FINAL)
document.addEventListener("DOMContentLoaded", function () {

    fetch("/centrosdeportivos/api")
        .then(res => res.json())
        .then(data => {

            if (!data || data.length === 0) {
                console.log("No hay centros para mostrar");
                return;
            }

            mostrarCentros(data);

        })
        .catch(err => console.error("Error cargando centros:", err));

});
</script>

</body>
</html>
