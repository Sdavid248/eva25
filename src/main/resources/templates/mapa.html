    <title>Mapa - Centros Deportivos</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
 <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <style>
        #mi_mapa {
            width: 100%;
            height: 800px;
        }

        #formCentro {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            background: white;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            border-radius: 10px;
            z-index: 9999;
        }

        #formCentro input, #formCentro button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
        }

        #closeForm {
            background: rgb(88, 139, 198);
            color: white;
        }
    </style>
</head>

<body>

<div id="mi_mapa"></div>

<div id="formCentro">
    <h3>Agregar Centro Deportivo</h3>

    <input id="nombre" type="text" placeholder="Nombre del centro">
    <input id="direccion" type="text" placeholder="Dirección real">
    <input id="telefono" type="text" placeholder="Teléfono">
    <input id="apertura" type="text" placeholder="Hora apertura">
    <input id="cierre" type="text" placeholder="Hora cierre">

    <button onclick="guardarCentro()">Guardar</button>
    <button id="closeForm" onclick="cerrarFormulario()">Cancelar</button>
</div>

<script th:inline="javascript">

    const centros = /*[[${centros}]]*/ [];

    console.log("Centros recibidos:", centros);

    let map = L.map('mi_mapa').setView([4.7110, -74.0721], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    centros.forEach(c => {

        if (c.lat && c.lng) {

            L.marker([c.lat, c.lng])
                .addTo(map)
                .bindPopup(
                    `<b>${c.nombre}</b><br>${c.direccion}`
                );
        }
    });

    map.on('click', () => {
        document.getElementById("formCentro").style.display = "block";
    });

    function cerrarFormulario() {
        document.getElementById("formCentro").style.display = "none";
    }

    async function guardarCentro() {

        const data = {
            nombre: document.getElementById("nombre").value,
            direccion: document.getElementById("direccion").value,
            telefono: document.getElementById("telefono").value,
            apertura: document.getElementById("apertura").value,
            cierre: document.getElementById("cierre").value
        };

        const resp = await fetch("/centrosdeportivos/nuevo", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        if (resp.ok) {
            alert("Centro guardado correctamente");
            location.reload();
        } else {
            alert("Error al guardar");
        }
    }

</script>

</body>
