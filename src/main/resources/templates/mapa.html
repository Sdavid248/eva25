<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔥 AGREGADO CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />

    <!-- 🔥 RUTAS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
    />
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <style>
      #mi_mapa {
        height: 600px;
      }

      .panel {
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <h2>Mapa de Centros Deportivos</h2>

    <div class="panel">
      <div
        id="topPanel"
        style="
          position: absolute;
          top: 120px;
          right: 10px;
          width: 250px;
          background: white;
          padding: 10px;
          border-radius: 10px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
          z-index: 1000;
          max-height: 400px;
          overflow: auto;
        "
      >
        <h4>🔥 Top Centros</h4>
        <div id="topLista"></div>
      </div>
      <input type="text" id="busqueda" placeholder="Buscar centro" />
      <button onclick="buscarCentro()">Buscar</button>
      <button onclick="verTop()">🔥 Top centros</button>

      <label for="filtroTipo">Filtrar por tipo:</label>
      <select id="filtroTipo" onchange="filtrarTipo()">
        <option value="">Todos</option>
        <option value="gym">Gym</option>
        <option value="piscina">Piscina</option>
        <option value="cancha">Cancha</option>
      </select>

      <button onclick="buscarCercanos()">Cercanos</button>
    </div>

    <div id="mi_mapa"></div>

    <script>
      let map = L.map("mi_mapa").setView([4.711, -74.0721], 13);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

      let marcadores = [];
      let rutaControl = null;
      let usuarioLatLng = null;
      let centrosGlobal = [];

      // 🔥 NUEVO (TOP)
      let marcadoresTop = [];

      // 🔥 ICONO DORADO
      const iconoTop = L.icon({
        iconUrl: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png",
        iconSize: [35, 35],
      });

      function limpiarMapa() {
        marcadores.forEach((m) => map.removeLayer(m));
        marcadores = [];

        if (rutaControl) {
          map.removeControl(rutaControl);
          rutaControl = null;
        }
      }

      // 🔥 LIMPIAR SOLO TOP
      function limpiarTop() {
        marcadoresTop.forEach((m) => map.removeLayer(m));
        marcadoresTop = [];
      }

      function mostrarCentros(data) {
        limpiarMapa();

        data.sort((a, b) => (a.distancia || 0) - (b.distancia || 0));

        data.forEach((c) => {
          const marker = L.marker([c.lat, c.lng]).addTo(map);

          marker.bindPopup(`
    <b>${c.nombre}</b><br>
    ${c.direccion}<br>

    🏷️ ${c.tipo || "N/A"}<br>
    📏 ${c.distancia ?? "N/A"} km<br>

    ⭐ ${estrellasHTML(Math.round(c.promedio || 0))} 
    (${c.promedio || 0})<br><br>

    <button onclick="crearRuta(${c.lat}, ${c.lng})">Ir</button>
    <button onclick="verValoraciones(${c.rut})">Ver valoraciones</button>

    <hr>

    <form onsubmit="guardarValoracion(event, ${c.rut})">
        ⭐ 
        <select id="estrellas-${c.rut}">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select><br>

        <input type="text" id="comentario-${c.rut}" placeholder="Comentario"><br>

        <button type="submit">Enviar</button>
    </form>

    <div id="valoraciones-${c.rut}"></div>
`);
          marcadores.push(marker);
        });

        centrosGlobal = data;
      }

      function buscarCercanos() {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          usuarioLatLng = [lat, lng];

          L.marker(usuarioLatLng)
            .addTo(map)
            .bindPopup("📍 Tu ubicación")
            .openPopup();

          map.setView(usuarioLatLng, 14);

          fetch(`/centrosdeportivos/cercanos?lat=${lat}&lng=${lng}`)
            .then((res) => res.json())
            .then((data) => {
              if (data.length === 0) {
                alert("No hay centros cercanos");
                return;
              }

              mostrarCentros(data);
            });
        });
      }

      function crearRuta(lat, lng) {
        if (!usuarioLatLng) {
          alert("Primero busca centros cercanos");
          return;
        }

        if (rutaControl) {
          map.removeControl(rutaControl);
        }

        rutaControl = L.Routing.control({
          waypoints: [
            L.latLng(usuarioLatLng[0], usuarioLatLng[1]),
            L.latLng(lat, lng),
          ],
        }).addTo(map);
      }

      function buscarCentro() {
        const nombre = document.getElementById("busqueda").value;

        fetch(`/centrosdeportivos/buscar?nombre=${nombre}`)
          .then((res) => res.json())
          .then((data) => {
            if (data.length === 0) {
              alert("No se encontró ningún lugar con ese nombre");
              return;
            }

            map.setView([data[0].lat, data[0].lng], 15);
            mostrarCentros(data);
          });
      }

      function filtrarTipo() {
        const tipo = document.getElementById("filtroTipo").value;

        if (!tipo) {
          mostrarCentros(centrosGlobal);
          return;
        }

        const filtrados = centrosGlobal.filter((c) => c.tipo === tipo);
        mostrarCentros(filtrados);
      }

      function guardarValoracion(e, rut) {
        e.preventDefault();

        const estrellas = document.getElementById(`estrellas-${rut}`).value;
        const comentario = document.getElementById(`comentario-${rut}`).value;

        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector(
          'meta[name="_csrf_header"]',
        ).content;

        fetch(`/centrosdeportivos/valorar/${rut}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            [header]: token,
          },
          body: `estrellas=${estrellas}&comentario=${comentario}`,
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              alert(data.error);
              return;
            }

            alert(data.ok);
            verValoraciones(rut);
          });
      }

      function verValoraciones(rut) {
        fetch(`/centrosdeportivos/valoraciones/${rut}`)
          .then((res) => res.json())
          .then((data) => {
            let html = "<h4>Opiniones:</h4>";

            data.forEach((v) => {
              html += `
                    <p>
                        ⭐ ${v.valoracion} - ${v.usuario}<br>
                        ${v.comentario}
                    </p>
                `;
            });

            document.getElementById(`valoraciones-${rut}`).innerHTML = html;
          });
      }

      function estrellasHTML(valor) {
        let estrellas = "";

        for (let i = 1; i <= 5; i++) {
          estrellas += i <= valor ? "⭐" : "☆";
        }

        return estrellas;
      }

      // 🔥 TOP CENTROS (MODIFICADO SIN BORRAR NADA)
      function verTop() {
        fetch(`/centrosdeportivos/top`)
          .then((res) => res.json())
          .then((data) => {
            let html = "<h3>🔥 TOP CENTROS</h3>";

            limpiarTop(); // 🔥 NUEVO

            data.forEach((c, index) => {
              html += `
                    <p>
                        🏟️ Centro ${c.rut} <br>
                        ⭐ ${c.promedio}
                    </p>
                `;

              // 🔥 DIBUJAR EN MAPA
              const centro = centrosGlobal.find((x) => x.rut == c.rut);

              if (centro) {
                const marker = L.marker([centro.lat, centro.lng], {
                  icon: iconoTop,
                }).addTo(map);

                marker.bindPopup(`
                  🥇 TOP #${index + 1}<br>
                  <b>${centro.nombre}</b><br>
                  ⭐ ${c.promedio}
                `);

                marcadoresTop.push(marker);
              }
            });

            alert(html);
          });
      }
    </script>
  </body>
</html>
