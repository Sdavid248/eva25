<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <nav class="nav_menu">
        <ul class="nav_links">
            <li><a href="/src/main/resources/templates/index.html">Inicio</a></li>
            <li><a href="/src/main/resources/templates/acercade.html">Acerca de</a></li>
            <li><a href="/src/main/resources/templates/centrosdeportivos.html">Centros deportivos</a></li>
            <li><a href="/src/main/resources/templates/info.html">Info</a></li>
            <li><a href="/src/main/resources/templates/mapa.html">Mapa</a></li>
        </ul>
    </nav>
    <h2>Iniciar Sesión</h2>
    <form th:action="@{/login}" method="post">

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required />

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required />

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">Entrar</button>
    </form>

    <div th:if="${param.error}">Credenciales inválidas</div>
    <div th:if="${param.logout}">Sesión cerrada correctamente</div>
</body>
</html>
