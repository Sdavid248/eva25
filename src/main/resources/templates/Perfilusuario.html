<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/perfilusuario.css">
</head>
<body>

    <nav class="nav_menu">
    <ul class="nav_links">
        <li><a th:href="@{/}">Inicio</a></li>
        <li><a th:href="@{/acercade}">Acerca de</a></li>
        <li><a th:href="@{/centrosdeportivos}">Centros deportivos</a></li>
        <li><a th:href="@{/info}">Info</a></li>
        <li><a th:href="@{/mapa}">Mapa</a></li>
        <li><a th:href="@{/login}">Login</a></li>
        <li><a th:href="@{/registro}">Registro</a></li>
    </ul>
    </nav>

    <div class="perfil-container">
    <div class="text-center">
        <img th:src="${foto}" alt="Foto de perfil" class="perfil-img">

        <h2 class="mt-3" th:text="${nombre}">Nombre Usuario</h2>
        <p class="text-muted">Correo: <span th:text="${correo}"></span></p>
        <p class="text-muted">Ubicación: <span th:text="${ubicacion}"></span></p>
    </div>

    <div class="mt-4">
        <h4>Información adicional</h4>
        <ul>
        <li>Edad: <span th:text="${edad}"></span></li>
        <li>Ocupación: <span th:text="${ocupacion}"></span></li>
        <li>Intereses: <span th:text="${intereses}"></span></li>
        </ul>
    </div>

    <div class="mt-4 text-center">
        <a th:href="@{/editar-perfil}" class="btn btn-warning">Editar perfil</a>
        <a th:href="@{/logout}" class="btn btn-danger">Cerrar sesión</a>
    </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>fv
