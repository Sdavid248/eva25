<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="./css/registro.css">
    <link rel="stylesheet" href="./css/normalize.css">
</head>
<body>

    <nav class="nav_menu">
        <div class="logo">E.V.A Entrenamiento voluntario activo </div>
        <ul class="nav_links">
        <li><a href="/index.html">Inicio</a></li>
        <li><a href="/acerca de.html">Acerca de</a></li>
        <li><a href="/centrosdeportivos.html">Centros deportivos</a></li>
        <li><a href="/info.html">Info</a></li>
        </ul>
        
</nav>

    <div class="form-container">
        
        <h2>Registro de Usuario</h2>
            <form id="registerForm">
                
<!-- Tipo de usuario -->
        <label for="userType">Tipo de usuario:</label>
            <select id="userType" name="userType" required>
                <option value="">-- Selecciona uno --</option>
                <option value="cliente">Usuario</option>
                <option value="proveedor">Centro deportivo</option>
            </select>

<!-- Campos comunes -->
    <label for="name">Nombre completo:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>
    
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" required>

    <label for="confirmPassword">Confirmar contraseña:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>

<!-- Cliente -->
    <div id="clienteFields" class="hidden">
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">

        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
    </div>

<!-- Proveedor -->
    <div id="proveedorFields" class="hidden">
        <label for="empresa">Nombre del centro deportivo:</label>
        <input type="text" id="empresa" name="empresa">

        <label for="servicio">Tipo de centro deportivo:</label>
        <input type="text" id="servicio" name="servicio">

        <label for="ruc">RUC/NIT:</label>
        <input type="text" id="ruc" name="ruc">
    </div>

    <div id="errorMsg" class="error"></div>

    <button type="submit">Registrarse</button>
    </form>
    </div>

    <script src="./js/registro.js"></script>
</body>
</html>
