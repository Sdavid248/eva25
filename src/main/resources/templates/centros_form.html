<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Deportivo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h2 class="mb-4 text-center">Centro Deportivo</h2>

    <form action="/centrosdeportivos/guardar" method="post" class="card p-4 bg-secondary shadow">

        <!-- 🔥 CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- 🔥 SOLO PARA EDITAR -->
        <input type="hidden" name="rut" th:if="${centro.rut != null}" th:value="${centro.rut}"/>

        <!-- NOMBRE -->
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre *</label>
            <input id="nombre" type="text" name="nombre" class="form-control"
                   th:value="${centro.nombre}" placeholder="Ej: Centro Norte"
                   required minlength="3">
            <div class="invalid-feedback">Debe tener al menos 3 caracteres</div>
        </div>

        <!-- DIRECCIÓN -->
        <div class="mb-3">
            <label for="direccion" class="form-label">Dirección *</label>
            <input id="direccion" type="text" name="direccion" class="form-control"
                   th:value="${centro.direccion}" placeholder="Ej: Calle 123 #45-67"
                   required>
        </div>

        <!-- TELÉFONO -->
        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono *</label>
            <input id="telefono" type="text" name="telefono" class="form-control"
                   th:value="${centro.telefono}" placeholder="Ej: 3001234567"
                   pattern="[0-9]+" required>
        </div>

        <!-- CORREO -->
        <div class="mb-3">
            <label for="correo" class="form-label">Correo *</label>
            <input id="correo" type="email" name="correo" class="form-control"
                   th:value="${centro.correo}" placeholder="correo@ejemplo.com"
                   required>
        </div>

        <!-- APERTURA -->
        <div class="mb-3">
            <label for="apertura" class="form-label">Hora Apertura *</label>
            <input id="apertura" type="time" name="apertura" class="form-control"
                   th:value="${centro.apertura}" required>
        </div>

        <!-- CIERRE -->
        <div class="mb-3">
            <label for="cierre" class="form-label">Hora Cierre *</label>
            <input id="cierre" type="time" name="cierre" class="form-control"
                   th:value="${centro.cierre}" required>
        </div>

        <!-- CAPACIDAD -->
        <div class="mb-3">
            <label for="capacidad" class="form-label">Capacidad *</label>
            <input id="capacidad" type="number" name="capacidad" class="form-control"
                   th:value="${centro.capacidad}" min="1" required placeholder="Ej: 100">
        </div>

        <!-- 🔥 TIPO (NUEVO PARA EL MAPA) -->
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de Centro *</label>
            <select id="tipo" name="tipo" class="form-control" required>
                <option value="">Seleccione tipo</option>
                <option value="gym" th:selected="${centro.tipo == 'gym'}">Gym</option>
                <option value="piscina" th:selected="${centro.tipo == 'piscina'}">Piscina</option>
                <option value="cancha" th:selected="${centro.tipo == 'cancha'}">Cancha</option>
            </select>
        </div>

        <!-- ESTADO -->
        <div class="mb-3">
            <label for="estado" class="form-label">Estado *</label>
            <select id="estado" name="estado" class="form-control" required>
                <option value="activo" th:selected="${centro.estado == 'activo'}">Activo</option>
                <option value="inactivo" th:selected="${centro.estado == 'inactivo'}">Inactivo</option>
            </select>
        </div>

        <!-- MENSAJE ERROR -->
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <!-- BOTONES -->
        <div class="d-flex justify-content-between">
            <a href="/centrosdeportivos/gestion" class="btn btn-light">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar</button>
        </div>

    </form>

</div>

<script>
    // VALIDACIÓN BOOTSTRAP
    (() => {
        'use strict'
        const forms = document.querySelectorAll('form')

        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
