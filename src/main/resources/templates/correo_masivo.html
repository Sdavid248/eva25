<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Enviar Correo Masivo</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">📩 Enviar Correo Masivo</h2>

    
    <form th:action="@{/correo/enviar}" th:method="post">

        
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        
        <div class="mb-3">
            <label for="destinatarios" class="form-label">Destinatarios (separados por coma, ; o salto de línea)</label>
            <textarea class="form-control" id="destinatarios" name="destinatarios" rows="3"
                        placeholder="ej: usuario1@correo.com, usuario2@gmail.com"></textarea>
            <div class="form-text">Puedes pegar una lista larga; el sistema la separará automáticamente.</div>
        </div>

        
        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto del correo</label>
            <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Asunto del mensaje">
        </div>

        
        <div class="mb-3">
            <label for="editorHtml" class="form-label">Contenido del correo (HTML permitido)</label>
            <textarea id="editorHtml" name="mensajeHtml" class="form-control" rows="10"
                        placeholder="Escribe o pega aquí tu mensaje en HTML"></textarea>
            <div class="form-text">Si quieres usar la plantilla por defecto, deja este campo vacío.</div>
        </div>

        <button type="submit" class="btn btn-primary">Enviar correo</button>
    </form>
</div>

</body>
</html>
