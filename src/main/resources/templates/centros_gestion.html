<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Gestión de Centros</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1>Gestión de Centros Deportivos</h1>

    <a href="/centrosdeportivos/nuevo" class="btn btn-success mb-3">+ Nuevo Centro</a>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="c : ${centros}">
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.direccion}"></td>
                <td th:text="${c.telefono}"></td>

                <td>
                    <a th:href="@{'/centrosdeportivos/editar/' + ${c.rut}}" 
                       class="btn btn-warning btn-sm">Editar</a>

                    <a th:href="@{'/centrosdeportivos/eliminar/' + ${c.rut}}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar este centro?')">
                       Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
